<!DOCTYPE html>
<html>
	<head>
		<title>Ouroboros</title>
		<link rel="stylesheet" href="./main.css" />

		<script src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@v0.129.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@v0.129.0/examples/jsm/"
				}
			}
		</script>
	</head>
	<body>
		<canvas></canvas>

		<script id="vertexShader" type="x-shader/x-vertex">
			#ifndef HALF_PI
			#define HALF_PI 1.5707963267948966
			#endif

			attribute float random;
			uniform float uTime;

			void main() {
				float timeLarge = uTime * 100.0;	

				vec3 newPosition = vec3(
					position.x, 
					(position.y - inversesqrt(timeLarge - 
					(random * 500.0)) * 500.0 + 
					(inversesqrt(uTime) * 65.0) +
					(inversesqrt(uTime) * 20.0)),
					position.z
				);

				gl_PointSize = 3.0; 
				gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);

			}
		</script>

		<script id="fragmentShader" type="x-shader/x-fragment">
			uniform float screenWidth;
			uniform float screenHeight;
			uniform vec2 uMouse;

			void main() {
				vec2 screen = vec2(screenWidth, screenHeight);
				vec2 st = gl_FragCoord.xy / screen.xy;

				float R = sin(uMouse.x / screenWidth) + 1.0 - st.x;
				float G = sin(uMouse.y / screenHeight) - st.y; 
				
				vec2 color = vec2(1.0, 1.0);

				gl_FragColor = vec4(1.0, color, 1.0);
			}
		</script>

		<script type="module" src="./main.js"></script>
	</body>
</html>
